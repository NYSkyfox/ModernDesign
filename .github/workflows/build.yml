# ModernDesign CI：CMake 构建 + 运行截图
# 手动触发：Actions 页面点 "Run workflow"
name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build (Release|x64) + Screenshot
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Release|x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== build output ==="
          Get-ChildItem build/bin -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe','.dll' } |
            Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table -AutoSize

      - name: Run + Screenshot
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1
          pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1 -NavMode compact -OutName screenshot_compact.png
          pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1 -NavMode top     -OutName screenshot_top.png
          pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1 -NavMode minimal -OutName screenshot_minimal.png
          pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1 -ShowDialog -OutName screenshot_dialog.png

      - name: Version artifacts (sha7 + timestamp)
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $ts  = Get-Date -Format 'yyyyMMddHHmm'
          $ver = "ModernDesign_${sha}_${ts}"
          $exe = Get-ChildItem build/bin -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "${ver}.exe" -Force }
          if (Test-Path 'screenshot.png') { Copy-Item 'screenshot.png' "${ver}.png" -Force }
          if (Test-Path 'screenshot_compact.png') { Copy-Item 'screenshot_compact.png' "${ver}_compact.png" -Force }
          if (Test-Path 'screenshot_top.png')     { Copy-Item 'screenshot_top.png'     "${ver}_top.png" -Force }
          if (Test-Path 'screenshot_minimal.png') { Copy-Item 'screenshot_minimal.png' "${ver}_minimal.png" -Force }
          if (Test-Path 'screenshot_dialog.png')  { Copy-Item 'screenshot_dialog.png'  "${ver}_dialog.png" -Force }
          Write-Host "artifact version: ${ver}"
          Get-ChildItem ModernDesign_* -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ModernDesign-x64-Release
          path: ModernDesign_*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ModernDesign-screenshot
          path: ModernDesign_*.png
          retention-days: 30
          if-no-files-found: warn