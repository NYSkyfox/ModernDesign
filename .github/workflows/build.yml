# ModernDesign CI：CMake 构建 + 运行截图
# 手动触发：Actions 页面点 "Run workflow"
name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build (Release|x64) + Screenshot
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose toolchain
        shell: pwsh
        run: |
          Write-Host "=== cmake ==="
          cmake --version
          Write-Host "=== vswhere ==="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationPath
            & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property displayName
          } else {
            Write-Host "vswhere NOT FOUND at $vswhere"
          }
          Write-Host "=== VS install dirs ==="
          Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object Name
          Write-Host "=== Generators ==="
          cmake --help | Select-String -Pattern "Visual Studio"

      - name: Configure (Release|x64)
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -T host=x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== build output ==="
          Get-ChildItem build/bin -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.exe','.dll' } |
            Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table -AutoSize

      - name: Run + Screenshot
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File screenshot.ps1

      - name: Version artifacts (sha7 + timestamp)
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0,7)
          $ts  = Get-Date -Format 'yyyyMMddHHmm'
          $ver = "ModernDesign_${sha}_${ts}"
          $exe = Get-ChildItem build/bin -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName "${ver}.exe" -Force }
          if (Test-Path 'screenshot.png') { Copy-Item 'screenshot.png' "${ver}.png" -Force }
          Write-Host "artifact version: ${ver}"
          Get-ChildItem ModernDesign_* -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='KB';e={[math]::Round($_.Length/1KB,1)}} |
            Format-Table

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ModernDesign-x64-Release
          path: ModernDesign_*.exe
          retention-days: 30
          if-no-files-found: warn

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ModernDesign-screenshot
          path: ModernDesign_*.png
          retention-days: 30
          if-no-files-found: warn